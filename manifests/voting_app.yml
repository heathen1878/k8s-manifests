apiVersion: v1
kind: Namespace
metadata:
  name: voting-app
  annotations:
    kubernetes.io/change-cause: "Initial creation of voting app namespace"
---
apiVersion: v1
kind: Service
metadata:
  name: db
  annotations:
    kubernetes.io/change-cause: "Initial creation of db service"
  namespace: voting-app
  labels:
    app: voting-app-db
spec:
  selector:
    app: voting-app-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  annotations:
    kubernetes.io/change-cause: "Initial creation of redis service"
  namespace: voting-app
  labels:
    app: voting-app-redis
spec:
  selector:
    app: voting-app-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  annotations:
    kubernetes.io/change-cause: "Initial creation of frontend voting service"
  namespace: voting-app
  labels:
    app: voting-app-frontend
spec:
  type: NodePort
  selector:
    app: voting-app-frontend
  ports:
    - name: frontend
      port: 80
      targetPort: 80
      nodePort: 31000
---
apiVersion: v1
kind: Service
metadata:
  name: result
  annotations:
    kubernetes.io/change-cause: "Initial creation of frontend result service"
  namespace: voting-app
  labels:
    app: result-app-frontend
spec:
  type: NodePort
  selector:
    app: result-app-frontend
  ports:
    - name: frontend
      port: 80
      targetPort: 80
      nodePort: 31001