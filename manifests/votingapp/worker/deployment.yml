apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  annotations:
    kubernetes.io/change-cause: "Initial deployment of the worker service"
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: kodekloud/examplevotingapp_worker:v1
