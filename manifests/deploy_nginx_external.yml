apiVersion: v1
kind: Service
metadata:
  name: nginx-pod
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80 # service port - mandatory
      protocol: TCP
  selector:
    app: nginx-lb
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx-lb
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80 # as per the service port above
