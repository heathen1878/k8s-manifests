apiVersion: v1
kind: Service
metadata:
  name: nodeport-service
spec:
  type: NodePort
  ports:
    - port: 80 # service port - mandatory
      targetPort: 80 # pod port
      nodePort: 30000 # frontend port
  selector:
    app: nginx-np
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx-np
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80 # as per the service port above